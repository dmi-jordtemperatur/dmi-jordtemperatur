
name: Opdater jordtemperatur

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: dmi-soil-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent DMI-data og lav CSV
        run: python update.py
      - name: Gem opdaterede data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jordtemperatur.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Opdater jordtemperatur'
            git push
          fi
